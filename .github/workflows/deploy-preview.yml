name: Deploy phone preview

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_REPOSITORY: binny0114-star/lost-dawn-preview-0217
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Configure preview deploy key
        env:
          PREVIEW_DEPLOY_KEY: ${{ secrets.PREVIEW_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PREVIEW_DEPLOY_KEY" > ~/.ssh/lost-dawn-preview
          chmod 600 ~/.ssh/lost-dawn-preview
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Publish static game
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/lost-dawn-preview -o IdentitiesOnly=yes
        run: |
          git clone "git@github.com:${PREVIEW_REPOSITORY}.git" /tmp/lost-dawn-preview
          find /tmp/lost-dawn-preview -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp index.html styles.css story-expansion.js dating-sim.js game.js robots.txt .nojekyll /tmp/lost-dawn-preview/
          cp -R assets /tmp/lost-dawn-preview/
          cd /tmp/lost-dawn-preview
          git config user.name "Lost Dawn Preview Bot"
          git config user.email "223556219+Copilot@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Preview is already current."
            exit 0
          fi
          git commit -m "Deploy ${SOURCE_SHA:0:7}"
          git push origin main
